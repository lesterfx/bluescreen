<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bluescreen Tracking Markers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0000ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0000ff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body.idle, body.idle * { cursor: none !important; }
  #stage { position: fixed; inset: 0; }
  #safeTop { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
  #topTint { position: fixed; top: 0; left: 0; right: 0; height: max(20px, env(safe-area-inset-top, 0px)); pointer-events: none; }
  #kbFill { display: none; position: fixed; left: 0; right: 0; bottom: 0; }
  .dot { position: absolute; border-radius: 50%; }

  #panel {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 24px);
    box-sizing: border-box; padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center;
    background: rgba(24, 26, 32, .92); color: #e8eaf0;
    border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
    opacity: 1; transition: opacity .25s;
  }
  #panel.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s, visibility 0s .25s; }
  #panel label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #panel .unit { margin-left: -4px; color: #aab0c0; }
  #panel input.pct { width: 4.5em; }
  #panel input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid #555b6b; border-radius: 6px; background: none; }
  #panel input[type=number] {
    width: 3.5em; padding: 4px 6px; border-radius: 6px;
    border: 1px solid #555b6b; background: #0f1116; color: inherit; font: inherit;
  }
  #panel input[type=range] { width: 110px; }
  #panel button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #555b6b;
    background: #2a2e39; color: inherit; font: inherit; cursor: pointer;
  }
  #panel button:hover { background: #363b49; }
  #panel :focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .pattern { display: flex; align-items: center; gap: 6px; }
  #panel .sub { color: #aab0c0; font-size: 12px; }

  /* Invisible field that holds focus so the iOS keyboard stays up. 16px font stops iOS from zooming in. */
  #kbInput {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    margin: 0; padding: 0; border: 0; outline: 0; resize: none; overflow: hidden;
    opacity: 0; font-size: 16px; color: transparent; caret-color: transparent; background: transparent;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="kbFill"></div>
<div id="safeTop" aria-hidden="true"></div>
<div id="topTint" aria-hidden="true"></div>
<textarea id="kbInput" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>

<div id="panel" role="toolbar" aria-label="Display settings">
  <label>Background <input type="color" id="bg"></label>
  <label>Markers <input type="color" id="mk"></label>
  <label>Size <input type="range" id="size" min="0.5" max="15" step="0.1"><input type="number" id="sizeN" class="pct" min="0.5" max="15" step="0.1" aria-label="Size percent"><span class="unit">%</span></label>
  <label>Opacity <input type="range" id="opacity" min="0" max="100" step="1"><input type="number" id="opacityN" class="pct" min="0" max="100" step="1" aria-label="Marker opacity percent"><span class="unit">%</span></label>
  <span class="pattern">Pattern
    <input type="number" id="rows" min="1" max="30" aria-label="Rows">
    <span aria-hidden="true">×</span>
    <input type="number" id="cols" min="1" max="30" aria-label="Columns">
  </span>
  <label>Edge margin <input type="range" id="margin" min="0" max="45" step="1"><input type="number" id="marginN" class="pct" min="0" max="45" step="1" aria-label="Edge margin percent"><span class="unit">%</span></label>
  <label>Brightness <input type="range" id="bright" min="5" max="100" step="1"><input type="number" id="brightN" class="pct" min="5" max="100" step="1" aria-label="Brightness percent"><span class="unit">%</span></label>
  <span id="hint" hidden>Share → Add to Home Screen for fullscreen</span>
  <button id="fs" type="button">Fullscreen</button>
  <span id="kbWrap" hidden><button id="kb" type="button">Keyboard mode</button></span>
  <span id="touchHint" class="sub" hidden>Hold 2 fingers for 2s to show settings</span>
  <button id="reset" type="button">Reset</button>
</div>

<script>
(function () {
  var DEFAULTS = { bg: '#0000ff', mk: '#ffffff', size: 2, opacity: 100, rows: 3, cols: 3, margin: 12, bright: 100 };
  var KEY = 'bluescreen-markers-v1';
  var s = Object.assign({}, DEFAULTS);
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  function sanitize() {
    s.rows = Math.max(1, Math.min(30, Math.round(+s.rows) || 3));
    s.cols = Math.max(1, Math.min(30, Math.round(+s.cols) || 3));
    s.opacity = isNaN(+s.opacity) ? 100 : Math.max(0, Math.min(100, +s.opacity));
  }
  sanitize();

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), panel = $('panel');
  var ids = ['bg', 'mk', 'size', 'opacity', 'rows', 'cols', 'margin', 'bright'];

  function clamp(v, lo, hi, fallback) {
    v = parseFloat(v);
    return isNaN(v) ? fallback : Math.min(hi, Math.max(lo, v));
  }

  // Brightness scales the actual RGB values, so 100% is exactly the chosen color.
  function scaled(hex, b) {
    var n = parseInt(hex.slice(1), 16), f = b / 100;
    var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), bl = Math.round((n & 255) * f);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // Opacity fades the marker color toward whatever the background color is
  function mix(fg, bg, a) {
    var f = parseInt(fg.slice(1), 16), b = parseInt(bg.slice(1), 16), out = 0;
    for (var sh = 16; sh >= 0; sh -= 8) {
      var v = Math.round(((f >> sh) & 255) * a + ((b >> sh) & 255) * (1 - a));
      out |= v << sh;
    }
    return '#' + ('000000' + out.toString(16)).slice(-6);
  }

  // Keyboard mode (iOS): the real on-screen keyboard stays up and the markers fit the area above it
  var kbMode = false, kb = $('kbInput'), kbFill = $('kbFill'), KB_KEY = KEY + '-keyboard';
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Matches the iOS keyboard background in light and dark appearance
  function keyboardGray() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return dark ? '#1c1c1e' : '#d1d3d9';
  }

  // Panel controls are switched off in keyboard mode so the toolbar's ‹ › arrows have nowhere to go
  function setPanelEnabled(on) {
    panel.inert = !on;
    Array.prototype.forEach.call(panel.querySelectorAll('input, button'), function (el) { el.disabled = !on; });
  }

  // Height of the status bar area at the top (0 in landscape, or where the page doesn't reach under it)
  var safeProbe = $('safeTop'), topTint = $('topTint');
  function statusBarHeight() { return safeProbe.offsetHeight || 0; }

  // The visible area: above the keyboard in keyboard mode, otherwise the whole window
  // In keyboard mode the area seen while the keyboard is up is remembered, so the dots stay put
  // when the keyboard is closed (the checkmark, app switch) until a tap brings it back.
  // It's forgotten on rotation, since the keyboard is a different size then.
  var kbArea = null, kbUp = false;
  function viewport() {
    var vv = window.visualViewport;
    kbUp = false;
    if (kbMode && vv) {
      var cur = { x: vv.offsetLeft, y: vv.offsetTop, w: vv.width, h: vv.height };
      var full = document.documentElement.clientHeight || window.innerHeight;
      if (cur.h < full * 0.85) { kbArea = cur; kbUp = true; }
      else if (kbArea && Math.abs(kbArea.w - cur.w) < 2) return { x: cur.x, y: cur.y, w: kbArea.w, h: kbArea.h };
      return cur;
    }
    return { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
  }

  function render() {
    var v = viewport(), W = v.w, H = v.h;
    var bg = scaled(s.bg, s.bright), mk = scaled(mix(s.mk, s.bg, s.opacity / 100), s.bright);
    // iOS paints some edges itself using the page's base background color. In keyboard mode that
    // base is keyboard gray, so the strip iOS paints at the very bottom (below anything the page can
    // draw) matches the keyboard. The status bar is kept the screen color by the fixed blue strip
    // across the top, which Safari on iOS 26+ uses to tint the status bar instead of the base color.
    var base = kbUp ? keyboardGray() : bg;
    document.documentElement.style.background = base;
    document.body.style.background = base;
    topTint.style.background = bg;
    stage.style.cssText = 'background:' + bg + ';' + (kbMode
      ? 'left:' + v.x + 'px;top:' + v.y + 'px;width:' + W + 'px;height:' + H + 'px;right:auto;bottom:auto'
      : '');
    // In keyboard mode, a separate gray layer sits behind the see-through keyboard and its toolbar,
    // so the keyboard looks normal instead of tinted blue
    kbFill.style.cssText = kbUp
      // Made extra tall on purpose: with the keyboard up, iOS's bottom edge sits below the page's
      // own bottom, and a strip there would otherwise show the screen color through the keyboard
      ? 'display:block;background:' + keyboardGray() + ';top:' + Math.round(v.y + H) + 'px;bottom:auto;height:' +
        Math.max(screen.height || 0, screen.width || 0, window.innerHeight) + 'px'
      : '';

    // Marker size follows the full screen so dots don't shrink when the keyboard opens
    var de = document.documentElement;
    var d = Math.round(Math.min(de.clientWidth || W, de.clientHeight || H) * s.size / 100);
    // Dots stay below the status bar (iOS blurs whatever sits under it), so rows are laid out
    // in the area between the status bar and the bottom of the visible screen
    var T = Math.max(0, statusBarHeight() - v.y), AH = H - T;
    var mx = W * s.margin / 100, my = AH * s.margin / 100;
    var frag = document.createDocumentFragment();
    var ys = [], step = s.rows > 1 ? (AH - 2 * my) / (s.rows - 1) : 0;
    for (var r = 0; r < s.rows; r++) ys.push(T + (s.rows === 1 ? AH / 2 : my + r * step));
    // Keyboard mode: extra rows at the same spacing continue down the rest of the screen. They sit
    // under the gray keyboard layer while the keyboard is up and show once it's closed.
    if (kbMode && step > 0) {
      var bottom = (de.clientHeight || window.innerHeight) - v.y - my;
      for (var ey = ys[ys.length - 1] + step; ey <= bottom; ey += step) ys.push(ey);
    }
    for (var r = 0; r < ys.length; r++) {
      var y = ys[r];
      for (var c = 0; c < s.cols; c++) {
        var x = s.cols === 1 ? W / 2 : mx + c * (W - 2 * mx) / (s.cols - 1);
        var dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.cssText = 'width:' + d + 'px;height:' + d + 'px;background:' + mk +
          ';left:' + Math.round(x - d / 2) + 'px;top:' + Math.round(y - d / 2) + 'px';
        frag.appendChild(dot);
      }
    }
    stage.replaceChildren(frag);
  }

  var LIMITS = [['size', 0.5, 15], ['opacity', 0, 100], ['margin', 0, 45], ['bright', 5, 100]];

  function syncControls() {
    ids.forEach(function (id) { $(id).value = s[id]; });
    LIMITS.forEach(function (k) { $(k[0] + 'N').value = s[k[0]]; });
  }

  // Settings are shared with other tabs/windows of this page (same browser) so a change in one updates the rest
  var channel = null;
  try { if ('BroadcastChannel' in window) channel = new BroadcastChannel(KEY); } catch (e) {}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    try { if (channel) channel.postMessage(s); } catch (e) {}
  }

  // Applied silently: a tab that's showing a clean screen stays clean
  function applyRemote(obj) {
    if (!obj || typeof obj !== 'object') return;
    s = Object.assign({}, DEFAULTS, obj);
    sanitize(); syncControls(); render();
  }
  if (channel) channel.onmessage = function (e) { applyRemote(e.data); };
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY || !e.newValue) return;
    try { applyRemote(JSON.parse(e.newValue)); } catch (err) {}
  });

  function read() {
    s.bg = $('bg').value; s.mk = $('mk').value;
    var rows = clamp($('rows').value, 1, 30, NaN), cols = clamp($('cols').value, 1, 30, NaN);
    if (!isNaN(rows)) s.rows = Math.round(rows);
    if (!isNaN(cols)) s.cols = Math.round(cols);
    render(); save();
  }

  ['bg', 'mk', 'rows', 'cols'].forEach(function (id) { $(id).addEventListener('input', read); });

  // Sliders and typed values stay in sync; out-of-range typing is clamped
  LIMITS.forEach(function (k) {
    var key = k[0], lo = k[1], hi = k[2], range = $(key), num = $(key + 'N');
    range.addEventListener('input', function () {
      s[key] = clamp(range.value, lo, hi, DEFAULTS[key]);
      num.value = s[key]; render(); save();
    });
    num.addEventListener('input', function () {
      var v = parseFloat(num.value);
      if (isNaN(v)) return;
      s[key] = clamp(v, lo, hi, DEFAULTS[key]);
      range.value = s[key]; render(); save();
    });
    num.addEventListener('change', syncControls);
  });
  $('rows').addEventListener('change', syncControls);
  $('cols').addEventListener('change', syncControls);
  $('reset').addEventListener('click', function () { s = Object.assign({}, DEFAULTS); syncControls(); render(); save(); });
  window.addEventListener('resize', render);

  // Fullscreen (needs a user gesture) and screen wake lock
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFs() {
    try {
      if (isFs()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); }
      }
    } catch (e) {}
    keepAwake();
  }
  var lock = null;
  function keepAwake() {
    try {
      if ('wakeLock' in navigator && !lock) {
        navigator.wakeLock.request('screen').then(function (l) {
          lock = l; l.addEventListener('release', function () { lock = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });
  $('fs').addEventListener('click', toggleFs);

  // iPhone Safari has no Fullscreen API: point to Add to Home Screen, and hide the dead button
  var el0 = document.documentElement;
  if (!(el0.requestFullscreen || el0.webkitRequestFullscreen)) {
    $('fs').hidden = true;
    if (!navigator.standalone) $('hint').hidden = false;
  }

  // Click the bare screen to go fullscreen the first time
  stage.addEventListener('click', function () { if (!kbMode && !isFs()) toggleFs(); });
  stage.addEventListener('dblclick', function () { if (!kbMode) toggleFs(); });

  window.addEventListener('keydown', function (e) {
    if (kbMode) { if (e.key === 'Escape') exitKb(); return; }
    var t = e.target && e.target.tagName;
    if ((e.key === 'f' || e.key === 'F') && t !== 'INPUT') toggleFs();
  });

  function focusKb() {
    try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); }
  }

  // Must run inside a tap: iOS only raises the keyboard when focus comes from a user gesture
  function enterKb(withFocus) {
    kbMode = true;
    if (withFocus) focusKb();
    try { localStorage.setItem(KB_KEY, '1'); } catch (e) {}
    clearTimeout(timer);
    panel.classList.add('off');
    setPanelEnabled(false);
    document.body.classList.add('idle');
    render();
  }

  function exitKb() {
    kbMode = false;
    kbArea = null;
    cancelHold();
    try { localStorage.removeItem(KB_KEY); } catch (e) {}
    setPanelEnabled(true);
    kb.blur(); kb.value = '';
    render(); wake();
  }

  $('kb').addEventListener('click', function () { enterKb(true); });
  if (isIOS || /[?&]keyboard\b/.test(location.search)) $('kbWrap').hidden = false;

  // Keep typed text from piling up in the hidden field
  kb.addEventListener('input', function () { if (kb.value.length > 2000) kb.value = ''; });

  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (kbMode) render(); }); } catch (e) {}

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { if (kbMode) render(); });
    window.visualViewport.addEventListener('scroll', function () { if (kbMode) render(); });
  }

  // Touch screens: taps on the bare screen never bring up the settings, so the screen stays clean
  // while it's handled on set. Holding two fingers down for 2 seconds shows the settings
  // (and in keyboard mode, also leaves keyboard mode). While the settings are showing, touches
  // keep them up as usual.
  // In keyboard mode taps also can't dismiss the keyboard, and a tap brings it back if it was
  // dismissed (Done, app switch, lock screen).
  var holdTimer = null;
  function cancelHold() { clearTimeout(holdTimer); holdTimer = null; }
  function panelHidden() { return panel.classList.contains('off'); }
  document.addEventListener('touchstart', function (e) {
    cancelHold();
    if (kbMode) e.preventDefault();
    else if (!panelHidden()) { wake(); return; }
    if (e.touches.length === 2) holdTimer = setTimeout(function () {
      holdTimer = null;
      if (kbMode) exitKb(); else wake();
    }, 2000);
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (e.touches.length !== 2) cancelHold();
    if (!kbMode) return;
    e.preventDefault();
    if (e.touches.length !== 2) cancelHold();
    if (e.touches.length === 0 && document.activeElement !== kb) focusKb();
  }, { passive: false });
  document.addEventListener('touchcancel', cancelHold);
  // Same for a mouse, so the mode can be tried on a desktop browser with ?keyboard
  document.addEventListener('mousedown', function (e) { if (kbMode) e.preventDefault(); });
  document.addEventListener('mouseup', function () { if (kbMode && document.activeElement !== kb) focusKb(); });

  // Controls appear on activity and vanish after 3 seconds of stillness
  var timer;
  function hide() {
    panel.classList.add('off');
    document.body.classList.add('idle');
    if (!kbMode && document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  }
  function wake() {
    if (kbMode) return;
    panel.classList.remove('off');
    document.body.classList.remove('idle');
    clearTimeout(timer);
    timer = setTimeout(hide, 3000);
  }
  // Mouse, pen and keys wake the controls any time; touch is handled by the two-finger hold above
  ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (e.pointerType === 'touch') return;
      wake();
    }, { passive: true });
  });
  if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) $('touchHint').hidden = false;
  document.addEventListener('fullscreenchange', wake);
  document.addEventListener('webkitfullscreenchange', wake);

  syncControls();
  // Keyboard mode survives a reload (iOS often reloads home-screen apps); the first tap raises the keyboard
  var kbSaved = false;
  try { kbSaved = localStorage.getItem(KB_KEY) === '1'; } catch (e) {}
  if (kbSaved && !$('kbWrap').hidden) enterKb(false); else { render(); wake(); }
})();
</script>
</body>
</html>
